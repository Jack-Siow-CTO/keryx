[package]
name = "keryx-worker"
description = "Keryx worker binary: composition root (config, loopback bind, graceful shutdown)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "keryx"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
keryx-api = { path = "../api" }
keryx-app = { path = "../app" }
keryx-domain = { path = "../domain" }
keryx-gateway = { path = "../gateway" }
keryx-model = { path = "../model" }
keryx-storage = { path = "../storage" }
keryx-tools = { path = "../tools" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
