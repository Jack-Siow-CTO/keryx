[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/app",
    "crates/storage",
    "crates/model",
    "crates/tools",
    "crates/api",
    "crates/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jack-Siow-CTO/keryx"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
