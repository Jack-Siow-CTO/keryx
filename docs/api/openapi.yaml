openapi: 3.1.0
info:
  title: Keryx Worker Control Plane
  version: 0.1.0
  description: |
    HTTP/SSE control plane for the Keryx Worker. Console is a thin Principal client
    of this API (ADR 0013, 0019, 0023, 0024). Worker remains the system of record.
servers:
  - url: http://127.0.0.1:8787
    description: Default loopback Worker bind
security: []
tags:
  - name: Health
  - name: Providers
  - name: Sessions
  - name: Runs
  - name: Approvals
  - name: Schedules
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe (unauthenticated)
      description: |
        Returns ok when the Worker process is up. Does not validate operator tokens.
        Console uses this with an authenticated probe to distinguish unreachable vs auth failure.
      security: []
      responses:
        "200":
          description: Worker is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/providers:
    get:
      tags: [Providers]
      operationId: listProviders
      summary: List registered model providers (no secrets)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Provider catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List Sessions (operator projection)
      description: |
        Console channel list: title (override or default from first user goal),
        timestamps, last message preview, active root Run summary, pending Approval count.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Create a Session
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created Session projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sessions/{session_id}/transcript:
    get:
      tags: [Sessions]
      operationId: getTranscript
      summary: Paged structured Transcript (newest first)
      description: |
        Durable conversation SoR for Console. Tool rows are compact (name, status, summary, artifact_refs).
        Pass `before` = oldest message id from previous page to scroll up for history.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: before
          in: query
          schema:
            type: string
          description: Exclusive older-bound message id
      responses:
        "200":
          description: Transcript page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sessions/{session_id}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get Session detail projection
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Sessions]
      operationId: patchSession
      summary: Rename Session title (durable on Worker)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSessionRequest"
      responses:
        "200":
          description: Updated Session projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/inbox:
    get:
      tags: [Sessions]
      operationId: listInbox
      summary: Inbox projection (Needs you)
      description: |
        Cross-Session attention items for Console “Needs you”: pending Approvals
        (kind approval_pending with approval_id) plus failed/interrupted root Runs.
        Items view existing Approvals and Runs; Inbox is not a write aggregate.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Inbox items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List Approvals
      description: |
        Principal Approval queue. Default pending=true returns only pending Approvals
        (Console sticky / Needs you source). Pass pending=false for all statuses.
      security:
        - bearerAuth: []
      parameters:
        - name: pending
          in: query
          description: When true (default), only pending Approvals
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Approvals list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/approvals/{approval_id}:
    get:
      tags: [Approvals]
      operationId: getApproval
      summary: Get one Approval
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/approvals/{approval_id}/approve:
    post:
      tags: [Approvals]
      operationId: approveApproval
      summary: Approve a pending Approval
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Updated Approval (status approved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Approval is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/approvals/{approval_id}/deny:
    post:
      tags: [Approvals]
      operationId: denyApproval
      summary: Deny a pending Approval
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Updated Approval (status denied)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Approval is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/memory:
    get:
      tags: [Sessions]
      operationId: listMemory
      security: [{bearerAuth: []}]
      responses: {"200": {description: ok}}
    post:
      tags: [Sessions]
      operationId: createMemory
      security: [{bearerAuth: []}]
      responses: {"201": {description: created}}
  /v1/memory/{memory_id}:
    get:
      tags: [Sessions]
      operationId: getMemory
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses: {"200": {description: ok}}
    put:
      tags: [Sessions]
      operationId: updateMemory
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses: {"200": {description: ok}}
    delete:
      tags: [Sessions]
      operationId: deleteMemory
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses: {"204": {description: deleted}}
  /v1/skills:
    get:
      tags: [Sessions]
      operationId: listSkills
      security: [{bearerAuth: []}]
      responses: {"200": {description: ok}}
  /v1/skills/{name}:
    get:
      tags: [Sessions]
      operationId: getSkill
      security: [{bearerAuth: []}]
      responses: {"200": {description: ok}}
  /v1/artifacts/{artifact_id}:
    get:
      tags: [Sessions]
      operationId: getArtifact
      security: [{bearerAuth: []}]
      responses: {"200": {description: ok}}
  /v1/sessions/{session_id}/runs:
    post:
      tags: [Runs]
      operationId: startRun
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses: {"201": {description: created}}
  /v1/runs/{run_id}:
    get:
      tags: [Runs]
      operationId: getRun
      security: [{bearerAuth: []}]
      responses: {"200": {description: ok}}
  /v1/runs/{run_id}/cancel:
    post:
      tags: [Runs]
      operationId: cancelRun
      security: [{bearerAuth: []}]
      responses: {"200": {description: ok}}
  /v1/runs/{run_id}/events:
    get:
      tags: [Runs]
      operationId: streamRunEvents
      security: [{bearerAuth: []}]
      responses: {"200": {description: SSE}}

  /v1/schedules:
    get:
      tags: [Schedules]
      operationId: listSchedules
      security: [{bearerAuth: []}]
      responses: {"200": {description: ok}}
    post:
      tags: [Schedules]
      operationId: createSchedule
      security: [{bearerAuth: []}]
      responses: {"201": {description: created}}
  /v1/schedules/{schedule_id}/pause:
    post:
      tags: [Schedules]
      operationId: pauseSchedule
      security: [{bearerAuth: []}]
      responses: {"200": {description: ok}}
  /v1/schedules/{schedule_id}/resume:
    post:
      tags: [Schedules]
      operationId: resumeSchedule
      security: [{bearerAuth: []}]
      responses: {"200": {description: ok}}
  /v1/schedules/{schedule_id}/delete:
    post:
      tags: [Schedules]
      operationId: deleteSchedule
      security: [{bearerAuth: []}]
      responses: {"200": {description: ok}}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: operator-token
      description: Operator token Principal auth (ADR 0004 / 0021). Console stores this in OS secure storage only.
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or invalid operator token; fail closed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ProviderInfo:
      type: object
      required:
        - name
        - auth_kind
        - display_name
        - default_model
        - models
        - registered
        - supports_model_override
      properties:
        name:
          type: string
          description: Provider key (openai, grok, openai_codex, …)
        auth_kind:
          type: string
        display_name:
          type: string
        default_model:
          type: string
        models:
          type: array
          items:
            type: string
        registered:
          type: boolean
        supports_model_override:
          type: boolean
    ProvidersResponse:
      type: object
      required: [providers]
      properties:
        default:
          type: string
          nullable: true
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderInfo"
    ActiveRootRunSummary:
      type: object
      required: [id, goal, status, origin]
      properties:
        id:
          type: string
        goal:
          type: string
        status:
          type: string
        origin:
          type: string
    SessionResponse:
      type: object
      required:
        - id
        - principal_id
        - title
        - title_is_custom
        - created_at
        - updated_at
        - pending_approval_count
      properties:
        id:
          type: string
        principal_id:
          type: string
        title:
          type: string
          description: Resolved display title (override or default from first user goal / "New Session")
        title_is_custom:
          type: boolean
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        last_message_preview:
          type: string
          nullable: true
        active_root_run:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActiveRootRunSummary"
        pending_approval_count:
          type: integer
          minimum: 0
    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionResponse"
    PatchSessionRequest:
      type: object
      properties:
        title:
          type: string
          description: Operator title override; empty clears to default
    ToolCompact:
      type: object
      required: [name, status, summary]
      properties:
        name:
          type: string
        status:
          type: string
        summary:
          type: string
        artifact_refs:
          type: array
          items:
            type: string
    TranscriptMessage:
      type: object
      required: [id, created_at, role, content]
      properties:
        id:
          type: string
        run_id:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
        tool:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ToolCompact"
    TranscriptPage:
      type: object
      required: [session_id, messages]
      properties:
        session_id:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptMessage"
          description: Newest-first
        next_before:
          type: string
          nullable: true
    ApprovalResponse:
      type: object
      required:
        - id
        - run_id
        - action
        - summary
        - status
        - requested_by
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        action:
          type: string
          description: Tool or action name (e.g. write_file, shell_exec)
        summary:
          type: string
          description: Redacted summary safe for control-plane listing
        status:
          type: string
          enum: [pending, approved, denied]
        requested_by:
          type: string
          description: Principal that created the wait (Run initiator)
        decided_by:
          type: string
          nullable: true
          description: Principal that approved or denied (when resolved)
    ApprovalsListResponse:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalResponse"
    InboxItem:
      type: object
      required:
        - id
        - kind
        - title
        - summary
        - created_at
      properties:
        id:
          type: string
          description: Projection row id (e.g. approval:{uuid}, run:{uuid})
        kind:
          type: string
          enum: [approval_pending, run_failed, run_interrupted]
        session_id:
          type: string
          nullable: true
        run_id:
          type: string
          nullable: true
        approval_id:
          type: string
          nullable: true
          description: |
            Set when kind is approval_pending. Links Inbox “Needs you” rows to
            GET /v1/approvals/{approval_id} and approve/deny.
        title:
          type: string
        summary:
          type: string
        created_at:
          type: integer
          format: int64
    InboxResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InboxItem"

